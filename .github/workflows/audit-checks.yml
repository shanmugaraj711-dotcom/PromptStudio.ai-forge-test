name: Audit Checks

on:
  push:
    branches:
      - prelaunch-full-audit-20260830
  pull_request:
    branches:
      - prelaunch-full-audit-20260830

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Run production build
        run: npm run build
