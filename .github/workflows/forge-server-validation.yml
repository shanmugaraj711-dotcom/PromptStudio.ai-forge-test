name: APK Forge Server Validation

on:
  push:
    branches: [forge/apk-forge]
    paths:
      - "server/api/apk-forge*.js"
      - "server/api/razorpay-webhook.js"
      - "server/api/_productConfig.js"
      - "src/pages/ApkForge/**"
      - "src/services/apkForge.js"
      - "api/index.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/forge-server-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Forge branch
        uses: actions/checkout@v4
        with:
          ref: forge/apk-forge
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(forge): synchronize npm lockfile"
          git push origin HEAD:forge/apk-forge
      - name: Verify clean npm ci
        run: npm ci
      - name: Lint Forge changes
        run: npx eslint server/api/apk-forge.js server/api/apk-forge-order.js server/api/apk-forge-verify.js server/api/apk-forge-reconcile.js server/api/apk-forge-review.js server/api/apk-forge-refund.js server/api/apk-forge-expiry.js server/api/razorpay-webhook.js src/pages/ApkForge/ApkForge.jsx src/services/apkForge.js api/index.js
      - name: Build web app
        run: npm run build
