name: APK Forge Protection Test

on:
  push:
    branches:
      - forge/apk-forge
    paths:
      - 'apk-forge/protection-test/trigger.txt'

permissions:
  contents: read

env:
  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

jobs:
  verify-protection-bypass:
    name: Verify protected Forge origin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Forge branch
        uses: actions/checkout@v4

      - name: Audit Forge branch for stale Vercel aliases
        run: |
          set -euo pipefail
          bad_alias='prompt-studio-ai-git-forge-apk-forge-prompt'
          bad_alias="${bad_alias}studioai.vercel.app"
          bad_suffix='prompt'
          bad_suffix="${bad_suffix}studioai.vercel.app"
          echo "Searching entire Forge branch for stale alias: $bad_alias"
          if git grep -n -F -- "$bad_alias" -- .; then
            echo "Stale Forge alias found; refusing reachability test." >&2
            exit 1
          fi
          echo "Zero matches for stale Forge alias."
          echo "Searching entire Forge branch for unhyphenated Vercel hostname suffix: $bad_suffix"
          if git grep -n -F -- "$bad_suffix" -- .; then
            echo "Unhyphenated Vercel hostname found; refusing reachability test." >&2
            exit 1
          fi
          echo "Zero matches for unhyphenated Vercel hostname suffix."

      - name: Verify protected Forge origin with automation bypass
        env:
          FORGE_WEB_ORIGIN: https://prompt-studio-ai-git-forge-apk-forge-prompt-studioai.vercel.app
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          echo "Checking protected Forge source origin: $FORGE_WEB_ORIGIN"
          status="$(curl --silent --show-error --location --max-time 15 --retry 2 --retry-delay 2 \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -o /dev/null -w '%{http_code}' "$FORGE_WEB_ORIGIN")"
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "Protection bypass check failed: expected HTTP 200, got $status" >&2
            exit 1
          fi
          echo "Protection bypass check passed: HTTP 200"
