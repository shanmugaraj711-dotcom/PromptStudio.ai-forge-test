name: APK Forge Build

run-name: APK Forge · ${{ github.event.client_payload.forgeRequestId || github.event.inputs.forge_request_id || 'manual-test' }}

on:
  workflow_dispatch:
    inputs:
      forge_request_id:
        description: 'Forge request ID'
        required: true
        type: string
      build_id:
        description: 'Unique Forge build ID'
        required: true
        type: string
      app_name:
        description: 'Android app display name'
        required: true
        type: string
        default: 'PromptStudio AI'
      forge_web_origin:
        description: 'HTTPS website origin to package into the APK'
        required: true
        type: string
        default: 'https://forge.invalid'
      package_id:
        description: 'Android application ID'
        required: true
        type: string
        default: 'in.promptstudio.ai'
      version_name:
        description: 'App version name'
        required: true
        type: string
        default: '0.1.0'
      version_code:
        description: 'Positive Android version code'
        required: true
        type: string
        default: '1'
  repository_dispatch:
    types: [apk_forge_build]
  push:
    branches:
      - forge/apk-forge
    paths:
      - 'apk-forge/android/**'
      - '.github/workflows/apk-forge-build.yml'

permissions:
  contents: read

env:
  FORGE_REQUEST_ID: ${{ github.event.client_payload.forgeRequestId || github.event.inputs.forge_request_id || 'manual-test' }}
  FORGE_BUILD_ID: ${{ github.event.client_payload.buildId || github.event.inputs.build_id || github.run_id }}
  FORGE_APP_NAME: ${{ github.event.client_payload.appName || github.event.inputs.app_name || 'PromptStudio AI' }}
  FORGE_WEB_ORIGIN: ${{ github.event.client_payload.forgeWebOrigin || github.event.inputs.forge_web_origin || 'https://forge.invalid' }}
  FORGE_PACKAGE_ID: ${{ github.event.client_payload.packageId || github.event.inputs.package_id || 'in.promptstudio.ai' }}
  FORGE_VERSION_NAME: ${{ github.event.client_payload.versionName || github.event.inputs.version_name || '0.1.0' }}
  FORGE_VERSION_CODE: ${{ github.event.client_payload.versionCode || github.event.inputs.version_code || '1' }}

jobs:
  build-apk:
    name: Build configurable APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apk-forge/android
    steps:
      - name: Checkout Forge branch
        uses: actions/checkout@v4

      - name: Validate Forge configuration
        run: |
          python - <<'PY'
          import os, re
          from urllib.parse import urlparse
          origin = os.environ['FORGE_WEB_ORIGIN'].strip().rstrip('/')
          parsed = urlparse(origin)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.path not in ('', '/') or parsed.query or parsed.fragment:
              raise SystemExit('FORGE_WEB_ORIGIN must be a valid HTTPS origin without path/query/fragment')
          if parsed.netloc == 'promptstudioai.in' or parsed.netloc.endswith('.promptstudioai.in'):
              raise SystemExit('Production origin is blocked in the Forge build pipeline')
          package_id = os.environ['FORGE_PACKAGE_ID'].strip()
          if not re.fullmatch(r'[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+', package_id):
              raise SystemExit('PACKAGE_ID must be a valid Android application ID')
          if not re.fullmatch(r'[1-9][0-9]*', os.environ['FORGE_VERSION_CODE'].strip()):
              raise SystemExit('VERSION_CODE must be a positive integer')
          if not os.environ['FORGE_APP_NAME'].strip():
              raise SystemExit('APP_NAME cannot be empty')
          if not os.environ['FORGE_VERSION_NAME'].strip():
              raise SystemExit('VERSION_NAME cannot be empty')
          if not os.environ['FORGE_REQUEST_ID'].strip() or not os.environ['FORGE_BUILD_ID'].strip():
              raise SystemExit('FORGE_REQUEST_ID and FORGE_BUILD_ID are required')
          print(f'Forge request: {os.environ["FORGE_REQUEST_ID"]}')
          print(f'Forge build: {os.environ["FORGE_BUILD_ID"]}')
          print(f'Forge origin accepted: {origin}')
          print(f'Package ID accepted: {package_id}')
          print(f'App: {os.environ["FORGE_APP_NAME"]} {os.environ["FORGE_VERSION_NAME"]} (code {os.environ["FORGE_VERSION_CODE"]})')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: >-
          gradle --no-daemon --stacktrace
          -PFORGE_WEB_ORIGIN="$FORGE_WEB_ORIGIN"
          -PAPP_NAME="$FORGE_APP_NAME"
          -PPACKAGE_ID="$FORGE_PACKAGE_ID"
          -PVERSION_NAME="$FORGE_VERSION_NAME"
          -PVERSION_CODE="$FORGE_VERSION_CODE"
          assembleDebug

      - name: Inspect APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptstudio-forge-${{ env.FORGE_BUILD_ID }}
          path: apk-forge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
