name: APK Forge Build

run-name: APK Forge · ${{ github.event.client_payload.forgeRequestId || github.event.inputs.forge_request_id || github.event.head_commit.message || 'manual-test' }}

on:
  push:
    branches:
      - forge/apk-forge
    paths:
      - 'apk-forge/requests/**'
  workflow_dispatch:
    inputs:
      forge_request_id:
        description: 'Forge request ID'
        required: true
        type: string
      build_id:
        description: 'Unique Forge build ID'
        required: true
        type: string
      app_name:
        description: 'Android app display name'
        required: true
        type: string
        default: 'PromptStudio AI'
      forge_web_origin:
        description: 'HTTPS website origin to package into the APK'
        required: true
        type: string
        default: 'https://forge.invalid'
      package_id:
        description: 'Android application ID'
        required: true
        type: string
        default: 'in.promptstudio.ai'
      version_name:
        description: 'App version name'
        required: true
        type: string
        default: '0.1.0'
      version_code:
        description: 'Positive Android version code'
        required: true
        type: string
        default: '1'

permissions:
  contents: read

env:
  FORGE_REQUEST_ID: ${{ github.event.client_payload.forgeRequestId || github.event.inputs.forge_request_id || '' }}
  FORGE_BUILD_ID: ${{ github.event.client_payload.buildId || github.event.inputs.build_id || '' }}
  FORGE_APP_NAME: ${{ github.event.client_payload.appName || github.event.inputs.app_name || '' }}
  FORGE_WEB_ORIGIN: ${{ github.event.client_payload.forgeWebOrigin || github.event.inputs.forge_web_origin || '' }}
  FORGE_PACKAGE_ID: ${{ github.event.client_payload.packageId || github.event.inputs.package_id || '' }}
  FORGE_VERSION_NAME: ${{ github.event.client_payload.versionName || github.event.inputs.version_name || '' }}
  FORGE_VERSION_CODE: ${{ github.event.client_payload.versionCode || github.event.inputs.version_code || '' }}

jobs:
  build-apk:
    name: Build configurable APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apk-forge/android
    steps:
      - name: Checkout Forge branch
        uses: actions/checkout@v4

      - name: Load branch-local Forge request
        if: github.event_name == 'push'
        working-directory: .
        run: |
          set -euo pipefail
          marker_path="$(git log -1 --pretty=%B | sed -n 's/^forge: queue //p' | head -n 1)"
          case "$marker_path" in
            apk-forge/requests/*.json) ;;
            *) echo "Invalid Forge queue marker path: $marker_path" >&2; exit 1 ;;
          esac
          test -f "$marker_path"
          python - "$marker_path" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as handle:
              data = json.load(handle)

          required = {
              "forgeRequestId": "FORGE_REQUEST_ID",
              "buildId": "FORGE_BUILD_ID",
              "appName": "FORGE_APP_NAME",
              "forgeWebOrigin": "FORGE_WEB_ORIGIN",
              "packageId": "FORGE_PACKAGE_ID",
              "versionName": "FORGE_VERSION_NAME",
              "versionCode": "FORGE_VERSION_CODE",
          }
          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as env:
              for source, target in required.items():
                  value = str(data.get(source, "")).strip()
                  if not value:
                      raise SystemExit(f"Missing Forge marker field: {source}")
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"Forge marker field contains a newline: {source}")
                  env.write(f"{target}={value}\n")
          PY

      - name: Validate Forge configuration
        run: |
          python - <<'PY'
          import os, re
          from urllib.parse import urlparse
          origin = os.environ['FORGE_WEB_ORIGIN'].strip().rstrip('/')
          parsed = urlparse(origin)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.path not in ('', '/') or parsed.query or parsed.fragment:
              raise SystemExit('FORGE_WEB_ORIGIN must be a valid HTTPS origin without path/query/fragment')
          if parsed.netloc == 'promptstudioai.in' or parsed.netloc.endswith('.promptstudioai.in'):
              raise SystemExit('Production origin is blocked in the Forge build pipeline')
          package_id = os.environ['FORGE_PACKAGE_ID'].strip()
          if not re.fullmatch(r'[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+', package_id):
              raise SystemExit('PACKAGE_ID must be a valid Android application ID')
          if not re.fullmatch(r'[1-9][0-9]*', os.environ['FORGE_VERSION_CODE'].strip()):
              raise SystemExit('VERSION_CODE must be a positive integer')
          if not os.environ['FORGE_APP_NAME'].strip():
              raise SystemExit('APP_NAME cannot be empty')
          if not os.environ['FORGE_VERSION_NAME'].strip():
              raise SystemExit('VERSION_NAME cannot be empty')
          if not os.environ['FORGE_REQUEST_ID'].strip() or not os.environ['FORGE_BUILD_ID'].strip():
              raise SystemExit('FORGE_REQUEST_ID and FORGE_BUILD_ID are required')
          print(f'Forge request: {os.environ["FORGE_REQUEST_ID"]}')
          print(f'Forge build: {os.environ["FORGE_BUILD_ID"]}')
          print(f'Forge origin accepted: {origin}')
          print(f'Package ID accepted: {package_id}')
          print(f'App: {os.environ["FORGE_APP_NAME"]} {os.environ["FORGE_VERSION_NAME"]} (code {os.environ["FORGE_VERSION_CODE"]})')
          PY

      - name: Verify source website is reachable
        run: |
          set -euo pipefail
          url="$FORGE_WEB_ORIGIN"
          echo "Checking Forge source origin: $url"
          if ! curl --fail --silent --show-error --location --max-time 15 --retry 2 --retry-delay 2 --output /dev/null "$url"; then
            echo "Forge source origin is unreachable or returned an HTTP error: $url" >&2
            echo "Refusing to build an APK against a dead source URL." >&2
            exit 1
          fi
          echo "Forge source origin is reachable: $url"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: >-
          gradle --no-daemon --stacktrace
          -PFORGE_WEB_ORIGIN="$FORGE_WEB_ORIGIN"
          -PAPP_NAME="$FORGE_APP_NAME"
          -PPACKAGE_ID="$FORGE_PACKAGE_ID"
          -PVERSION_NAME="$FORGE_VERSION_NAME"
          -PVERSION_CODE="$FORGE_VERSION_CODE"
          assembleDebug

      - name: Inspect APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptstudio-forge-${{ env.FORGE_BUILD_ID }}
          path: apk-forge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
