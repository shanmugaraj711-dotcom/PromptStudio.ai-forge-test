name: APK Forge Build

on:
  workflow_dispatch:
    inputs:
      forge_web_origin:
        description: 'HTTPS Forge preview origin to package into the APK'
        required: true
        type: string
        default: 'https://forge.invalid'
  push:
    branches:
      - forge/apk-forge
    paths:
      - 'apk-forge/android/**'
      - '.github/workflows/apk-forge-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build PromptStudio AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apk-forge/android
    env:
      FORGE_WEB_ORIGIN: ${{ github.event.inputs.forge_web_origin || 'https://forge.invalid' }}
    steps:
      - name: Checkout Forge branch
        uses: actions/checkout@v4

      - name: Validate non-production origin
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          origin = os.environ['FORGE_WEB_ORIGIN'].strip().rstrip('/')
          parsed = urlparse(origin)
          if parsed.scheme != 'https' or not parsed.netloc:
              raise SystemExit('FORGE_WEB_ORIGIN must be a valid HTTPS origin')
          if parsed.netloc == 'promptstudioai.in' or parsed.netloc.endswith('.promptstudioai.in'):
              raise SystemExit('Production origin is blocked in the Forge build pipeline')
          print(f'Forge origin accepted: {origin}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -PFORGE_WEB_ORIGIN="$FORGE_WEB_ORIGIN" assembleDebug

      - name: Inspect APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptstudio-ai-forge-debug-apk-${{ github.run_number }}
          path: apk-forge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
